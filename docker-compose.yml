# Self-hosted setup: PostgreSQL + the app, with persistent volumes for the
# database and uploaded photos.  Start with:  docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: travel_journal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_journal"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://travel:${POSTGRES_PASSWORD:-change-me}@db:5432/travel_journal
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /app/storage/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # set to false only if you serve the app over plain http
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
    volumes:
      - photos:/app/storage/uploads

volumes:
  pgdata:
  photos:
